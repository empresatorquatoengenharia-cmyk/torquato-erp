<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Torquato ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans flex items-center justify-center h-screen">

    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 bg-amber-500 text-slate-950 font-black rounded-xl flex items-center justify-center mx-auto text-xl shadow-lg">TE</div>
            <h1 class="text-xl font-bold text-white">Torquato ERP</h1>
            <p class="text-xs text-slate-400">Gestão de Engenharia • www.torquatoengenharia.com.br</p>
        </div>

        <div class="space-y-4 text-xs">
            <div>
                <label class="block text-slate-400 font-bold mb-1">E-mail de Acesso</label>
                <input type="email" id="login-email" placeholder="ex: admin@torquato.com" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-white focus:outline-none focus:border-amber-500">
            </div>
            <div>
                <label class="block text-slate-400 font-bold mb-1">Palavra-passe</label>
                <input type="password" id="login-senha" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-white focus:outline-none focus:border-amber-500">
            </div>
            <button onclick="fazerLogin()" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs transition shadow-lg">
                Entrar no Sistema
            </button>
        </div>
        
        <div class="text-center text-[10px] text-slate-500">
            Torquato Engenharia Ltda • Sincronizado via Supabase
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://otsrxvqypfpflbpaobhl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_G6bt_yL7toxF8vYSpyGLdw_jA8xAtN4';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fazerLogin() {
            const email = document.getElementById('login-email').value.trim();
            const senha = document.getElementById('login-senha').value.trim();

            if (!email || !senha) {
                alert('Preencha o e-mail e a palavra-passe.');
                return;
            }

            const { data, error } = await supabaseClient
                .from('usuarios_erp')
                .select('*')
                .eq('email', email)
                .eq('senha', senha)
                .single();

            if (error || !data) {
                alert('E-mail ou palavra-passe incorretos.');
            } else {
                localStorage.setItem('torquato_user', JSON.stringify(data));
                alert(`Bem-vindo ao sistema, ${data.nome}!`);
                window.location.href = 'admin.html';
            }
        }
    </script>
</body>
</html>

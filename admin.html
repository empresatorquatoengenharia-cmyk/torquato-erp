<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torquato ERP - Painel Administrativo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col m-0">

    <!-- Header Principal -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-amber-500 text-slate-950 font-black rounded-xl flex items-center justify-center text-lg shadow-md border border-amber-400">TE</div>
            <div>
                <h1 class="text-lg font-bold text-white tracking-tight">Torquato ERP</h1>
                <p class="text-[10px] text-slate-400">Painel Administrativo & Governança</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <span id="nome-usuario" class="text-xs text-amber-400 font-semibold bg-amber-500/10 px-3 py-1.5 rounded-lg border border-amber-500/20">A carregar...</span>
            <button onclick="sair()" class="text-xs text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg transition cursor-pointer">Sair</button>
        </div>
    </header>

    <!-- Layout Principal -->
    <div class="flex flex-1">
        <!-- Sidebar de Navegação -->
        <aside class="w-64 bg-slate-900/50 border-r border-slate-800/80 p-4 space-y-6">
            <div>
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Governança Corporativa</p>
                <nav class="space-y-1">
                    <a href="#" class="flex items-center space-x-2 bg-amber-500 text-slate-950 font-bold px-3 py-2 rounded-xl text-xs shadow-md">
                        <span>🏢</span>
                        <span>Dados da Empresa Matriz</span>
                    </a>
                    <a href="#" class="flex items-center space-x-2 text-slate-400 hover:text-white hover:bg-slate-800/50 px-3 py-2 rounded-xl text-xs transition">
                        <span>👥</span>
                        <span>Gestão de Utilizadores</span>
                    </a>
                </nav>
            </div>
        </aside>

        <!-- Conteúdo Central -->
        <main class="flex-1 p-8 max-w-5xl">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h2 class="text-xl font-bold text-white">Cadastro da Empresa Matriz</h2>
                    <p class="text-xs text-slate-400">Gerencie as informações institucionais e fiscais da empresa.</p>
                </div>
                <button type="button" id="btn-editar" onclick="habilitarEdicao()" class="bg-slate-800 hover:bg-slate-700 text-amber-400 border border-amber-500/30 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-2 cursor-pointer">
                    <span>✏️</span>
                    <span>Editar Dados</span>
                </button>
            </div>

            <!-- Caixa de Alerta / Status -->
            <div id="mensagem-status" class="hidden p-3 mb-6 rounded-xl text-xs font-semibold"></div>

            <!-- Formulário de Dados -->
            <form id="form-matriz" onsubmit="salvarMatriz(event)" class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                    <div>
                        <label class="block text-slate-400 font-bold mb-1">Razão Social</label>
                        <input type="text" id="razao_social" disabled class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-white disabled:opacity-60 disabled:cursor-not-allowed focus:outline-none focus:border-amber-500 transition">
                    </div>
                    <div>
                        <label class="block text-slate-400 font-bold mb-1">CNPJ</label>
                        <input type="text" id="cnpj" disabled class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-white disabled:opacity-60 disabled:cursor-not-allowed focus:outline-none focus:border-amber-500 transition">
                    </div>
                    <div>
                        <label class="block text-slate-400 font-bold mb-1">Inscrição Estadual</label>
                        <input type="text" id="inscricao_estadual" disabled class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-white disabled:opacity-60 disabled:cursor-not-allowed focus:outline-none focus:border-amber-500 transition">
                    </div>
                    <div>
                        <label class="block text-slate-400 font-bold mb-1">Inscrição Municipal</label>
                        <input type="text" id="inscricao_municipal" disabled class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-white disabled:opacity-60 disabled:cursor-not-allowed focus:outline-none focus:border-amber-500 transition">
                    </div>
                    <div>
                        <label class="block text-slate-400 font-bold mb-1">CEP</label>
                        <input type="text" id="cep" disabled class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-white disabled:opacity-60 disabled:cursor-not-allowed focus:outline-none focus:border-amber-500 transition">
                    </div>
                    <div>
                        <label class="block text-slate-400 font-bold mb-1">Estado (UF)</label>
                        <input type="text" id="estado" disabled class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-white disabled:opacity-60 disabled:cursor-not-allowed focus:outline-none focus:border-amber-500 transition">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-slate-400 font-bold mb-1">País</label>
                        <input type="text" id="pais" disabled class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-white disabled:opacity-60 disabled:cursor-not-allowed focus:outline-none focus:border-amber-500 transition">
                    </div>
                </div>

                <!-- Botões de Ação na Edição -->
                <div id="container-botoes-salvar" class="hidden pt-4 border-t border-slate-800/80 flex items-center justify-end space-x-3">
                    <button type="button" onclick="cancelarEdicao()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs transition cursor-pointer">
                        Cancelar
                    </button>
                    <button type="submit" id="btn-salvar" class="px-6 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs transition shadow-lg cursor-pointer">
                        Salvar Alterações
                    </button>
                </div>
            </form>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://otsrxvqypfpflbpaobhl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_G6bt_yL7toxF8vYSpyGLdw_jA8xAtN4';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let dadosMatrizOriginal = {};

        window.addEventListener('DOMContentLoaded', () => {
            verificarSessao();
            carregarDadosMatriz();
        });

        function verificarSessao() {
            const usuarioJSON = localStorage.getItem('torquato_user');
            if (!usuarioJSON) {
                window.location.href = 'login.html';
                return;
            }
            const usuario = JSON.parse(usuarioJSON);
            document.getElementById('nome-usuario').innerText = `${usuario.nome} (${usuario.perfil.toUpperCase()})`;
        }

        function sair() {
            localStorage.removeItem('torquato_user');
            window.location.href = 'login.html';
        }

        function exibirMensagem(texto, tipo) {
            const el = document.getElementById('mensagem-status');
            el.classList.remove('hidden', 'bg-red-950', 'text-red-300', 'border-red-800', 'bg-emerald-950', 'text-emerald-300', 'border-emerald-800');
            el.classList.add('border');
            if (tipo === 'erro') {
                el.classList.add('bg-red-950', 'text-red-300', 'border-red-800');
            } else {
                el.classList.add('bg-emerald-950', 'text-emerald-300', 'border-emerald-800');
            }
            el.innerText = texto;
        }

        async function carregarDadosMatriz() {
            try {
                const { data, error } = await supabaseClient
                    .from('empresa_matriz')
                    .select('*')
                    .eq('id', 1)
                    .single();

                if (error && error.code !== 'PGRST116') {
                    console.error('Erro ao carregar matriz:', error);
                    exibirMensagem('Erro ao carregar dados do Supabase: ' + error.message, 'erro');
                    return;
                }

                if (data) {
                    dadosMatrizOriginal = data;
                    preencherFormulario(data);
                }
            } catch (err) {
                console.error(err);
            }
        }

        function preencherFormulario(d) {
            document.getElementById('razao_social').value = d.razao_social || '';
            document.getElementById('cnpj').value = d.cnpj || '';
            document.getElementById('inscricao_estadual').value = d.inscricao_estadual || '';
            document.getElementById('inscricao_municipal').value = d.inscricao_municipal || '';
            document.getElementById('cep').value = d.cep || '';
            document.getElementById('estado').value = d.estado || '';
            document.getElementById('pais').value = d.pais || '';
        }

        function habilitarEdicao() {
            const inputs = document.querySelectorAll('#form-matriz input');
            inputs.forEach(input => input.disabled = false);

            document.getElementById('container-botoes-salvar').classList.remove('hidden');
            document.getElementById('btn-editar').classList.add('hidden');
            document.getElementById('razao_social').focus();
        }

        function cancelarEdicao() {
            const inputs = document.querySelectorAll('#form-matriz input');
            inputs.forEach(input => input.disabled = true);

            document.getElementById('container-botoes-salvar').classList.add('hidden');
            document.getElementById('btn-editar').classList.remove('hidden');

            preencherFormulario(dadosMatrizOriginal);
            document.getElementById('mensagem-status').classList.add('hidden');
        }

        async function salvarMatriz(e) {
            e.preventDefault();

            const btnSalvar = document.getElementById('btn-salvar');
            btnSalvar.disabled = true;
            btnSalvar.innerText = 'A guardar...';

            const payload = {
                id: 1,
                razao_social: document.getElementById('razao_social').value.trim(),
                cnpj: document.getElementById('cnpj').value.trim(),
                inscricao_estadual: document.getElementById('inscricao_estadual').value.trim(),
                inscricao_municipal: document.getElementById('inscricao_municipal').value.trim(),
                cep: document.getElementById('cep').value.trim(),
                estado: document.getElementById('estado').value.trim(),
                pais: document.getElementById('pais').value.trim(),
                atualizado_em: new Date().toISOString()
            };

            try {
                const { error } = await supabaseClient
                    .from('empresa_matriz')
                    .upsert([payload]);

                if (error) {
                    exibirMensagem(`Erro ao salvar: ${error.message}`, 'erro');
                } else {
                    dadosMatrizOriginal = payload;
                    exibirMensagem('Dados da Empresa Matriz salvos com sucesso!', 'sucesso');
                    
                    const inputs = document.querySelectorAll('#form-matriz input');
                    inputs.forEach(input => input.disabled = true);
                    document.getElementById('container-botoes-salvar').classList.add('hidden');
                    document.getElementById('btn-editar').classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
                exibirMensagem('Erro inesperado na gravação.', 'erro');
            } finally {
                btnSalvar.disabled = false;
                btnSalvar.innerText = 'Salvar Alterações';
            }
        }
    </script>
</body>
</html>
